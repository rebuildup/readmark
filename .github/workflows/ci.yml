# readmark — CI.
#
# Why each part:
# - Triggers: PR + push to main / release-X.Y.Z / numeric branches.
#   Numeric branches correspond to ticket branches per AGENTS.md §5.
# - Required checks: deliberately NOT set in branch protection.
#   rebuildup/project-init's policy is to avoid required-status-check
#   names that could deadlock the ruleset. The CI runs but does not
#   gate merge. The release PR is gated by manual review (0 approvals
#   on solo; no-op gate today).
# - Concurrency: per-workflow + per-ref; in-progress runs cancel on
#   new pushes (same pattern as rebuildup/my-web-2026 ci.yml).
# - mise: install without --locked. mise.toml is the source of truth
#   for toolchain versions (exact pins); we do not commit a mise
#   lockfile because the project-init convention is "use --locked
#   only when the lockfile is part of the reproducibility contract."
#   Adding one is a separate ticket.
# - bun install: --frozen-lockfile. bun.lock IS committed and IS the
#   reproducibility contract for JS dependencies.
# - validate:fast: typecheck + lint + test. Build is excluded to keep
#   PR feedback < 60s; release PRs additionally run validate locally.
# - Builds: two targets (ADR-0006 Amendment), each verified right
#   after it runs and before the next one overwrites `dist/`: the
#   default target must reference the host namespace read from
#   `app-base.ts`, the container target must be root-base. The
#   container build empties `outDir`, so `readmark-dist` publishes the
#   container artefact. No smoke runs here — CI proves the build
#   targets, not the runtime.

name: ci

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*", "[0-9]+"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Toolchain check
        run: mise install

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'mise.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check (biome ci)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # One place resolves the namespace, both checks consume it: the
      # literal itself lives only in `app-base.ts`.
      - name: "Resolve host namespace (app-base.ts)"
        run: |
          HOST_NS="$(bun -e 'const { APP_BASE } = await import("./app-base.ts"); process.stdout.write(APP_BASE ?? "")')"
          if [ -z "$HOST_NS" ]; then
            echo "app-base.ts exported an empty APP_BASE"
            exit 1
          fi
          echo "HOST_NS=$HOST_NS" >> "$GITHUB_ENV"

      - name: "Build (default target: host namespace)"
        run: bun run build

      # The container build empties `outDir` right afterwards, so the
      # default target's output only exists until then — check it now.
      - name: "Verify host-namespace dist"
        run: |
          if ! grep -qF "=\"${HOST_NS}assets/" dist/index.html; then
            echo "dist/index.html does not reference ${HOST_NS}assets/ — the default build lost the host namespace"
            grep -o 'src="[^"]*"' dist/index.html || true
            exit 1
          fi

      # Runs second so `dist/` is left root-base: the uploaded artefact
      # is what the Containerfile ships (ADR-0006 Amendment).
      - name: "Build (container target: root base)"
        run: bun run build:container

      # Guards the `--base=/` half of the container build. Without this
      # the default target would still pass CI and the regression would
      # surface only after deploy.
      - name: "Verify root-base dist"
        run: |
          if ! grep -q '="/assets/' dist/index.html; then
            echo "dist/index.html does not reference /assets/ — is this a root-base build?"
            exit 1
          fi
          if grep -qF "$HOST_NS" dist/index.html; then
            echo "dist/index.html still references the host namespace ($HOST_NS):"
            grep -nF "$HOST_NS" dist/index.html
            exit 1
          fi

      - name: Upload root-base dist (readmark-dist)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: readmark-dist
          path: dist/
          retention-days: 7