<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0d1d4d" />
		<meta name="description" content="readmark — ローカルファーストの読書環境" />
		<title>readmark</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!--
			No webfont, by design (ADR-0008 + the zero-external-origin
			decision): readmark fetches nothing from any third party.

			The font stacks in `src/styles.css` therefore name the
			machine's own Japanese faces first (Hiragino / Yu Gothic /
			Meiryo, then `system-ui`), so a machine that has a CJK
			face renders normally and one that does not was already
			outside what a webfont-less, offline-first document can
			promise. `display=swap`-era tofu risk is accepted here on
			purpose: a document that phones home for its own UI text
			would contradict the storage-free, zero-contact model this
			app ships with.
		-->
	</head>
	<body>
		<div id="app-root" data-app="readmark"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
