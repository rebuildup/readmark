server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for container probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Vite SPA — fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # COOP/COEP for SharedArrayBuffer (pdfjs-dist needs them for some
    # decode paths).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Long-cache hashed assets (Vite emits /assets/* with hashes).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # pdfjs-dist worker — served from root, no inline.
    location ~* \.worker\.mjs$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}